services:
  - type: web
    name: splitwise-lite-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run db:migrate
    startCommand: npm run start -w backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://splitwise.kadamsahil.com
      - key: DATABASE_URL
        fromDatabase:
          name: splitwise-lite-db
          property: connectionString

databases:
  - name: splitwise-lite-db
    plan: free
